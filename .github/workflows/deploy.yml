name: Build and deploy Aero Journey

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun run build

      - name: Locate static website
        id: site
        shell: bash
        run: |
          for dir in dist/client .output/public dist
          do
            if [ -f "$dir/index.html" ]; then
              echo "path=$dir" >> "$GITHUB_OUTPUT"
              echo "Website found in $dir"
              exit 0
            fi
          done

          echo "ERROR: Static index.html not found."
          find dist .output -maxdepth 4 -type f 2>/dev/null | head -100
          exit 1

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
